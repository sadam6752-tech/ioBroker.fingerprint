# Workflow for auto-merging Dependabot PRs
# This workflow uses the ioBroker auto-merge action to automatically merge
# Dependabot PRs based on the rules defined in .github/auto-merge.yml
#
# Note: this replaces the previous fastify/github-action-merge-dependabot setup.
# That action merges immediately when the PR is opened and does not wait for the
# test workflow, so it failed as long as the CI checks were still running (see
# PR #4 / PR #5 from 22.09.2026). The ioBroker action waits for the checks.
# Unlike the fastify action it also reads .github/auto-merge.yml, which was
# previously unused.

name: Auto-Merge Dependabot PRs

on:
  # Trigger when a PR is opened or updated
  # pull_request instead of pull_request_target: GitHub blocks pull_request_target for PRs
  # from forks by default from 02.11.2026 (ioBroker-Bot PR #11). Workflows run for PRs
  # created by dependabot get write access through 'permissions' below anyway.
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only run if actor is dependabot
    if: github.actor == 'dependabot[bot]'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Auto-merge Dependabot PRs
        uses: iobroker-bot-orga/action-automerge-dependabot@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Rules: development = minor (includes patch), package-lock only = minor (includes patch)
          config-file-path: '.github/auto-merge.yml'
          # Keep the Dependabot commits squashed, as before
          merge-method: 'squash'
          # Wait until the 'Test and Release' workflow has finished (default: true)
          wait-for-checks: 'true'
          max-wait-time: '3600'
